name: Tailscale monitor

# GitHub's `schedule:` trigger is best-effort - a '*/5' cron is routinely delayed
# by tens of minutes or coalesced away, so it cannot deliver 5-minute detection
# on its own.  Instead ONE job polls in a loop for ~50 minutes, and the cron is
# demoted to a watchdog that starts the next loop.  Because of the concurrency
# group, a run triggered while the loop is busy sits pending and takes over the
# moment the current one exits, which keeps coverage continuous.

on:
  schedule:
    # Watchdog only - it queues the next loop, it does not set the poll rate.
    # Deliberately offset from :00, which is GitHub's most congested minute and
    # the one most likely to be dropped.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      single_run:
        description: 'Poll once and exit instead of looping'
        type: boolean
        default: false
      force_digest:
        description: 'Send the full analytics digest on the first poll'
        type: boolean
        default: false
      dry_run:
        description: 'Log what would be sent without messaging Telegram'
        type: boolean
        default: false
  push:
    branches: [main]            # start polling as soon as a change is deployed
    paths-ignore: ['README.md', '.env.example']

permissions:
  contents: write

concurrency:
  group: tailscale-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LOOP_MINUTES: 330         # 5.5 h; GitHub's hard job limit is 6 h.
                                # Long on purpose: every exit needs a watchdog
                                # tick to hand over, so 4 handovers a day is far
                                # safer than 24 when the cron is unreliable.
      POLL_INTERVAL: 300        # seconds between polls
    steps:
      - name: Check out the monitor
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore saved state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/state_sync.sh restore

      - name: Poll Tailscale every ${{ env.POLL_INTERVAL }}s, notify Telegram
        env:
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAILNET: ${{ vars.TAILNET || '-' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          DIGEST_HOUR: ${{ vars.DIGEST_HOUR || '9' }}
          FLAP_CONFIRMATIONS: ${{ vars.FLAP_CONFIRMATIONS || '1' }}
          ONLINE_SOURCE: ${{ vars.ONLINE_SOURCE || 'auto' }}
          STATE_FILE: .state/state/state.json
          LOG_DIR: .state/logs
          FORCE_DIGEST: ${{ inputs.force_digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          SINGLE_RUN: ${{ inputs.single_run }}
        run: ./scripts/poll_loop.sh

      # Tailscale API tokens expire (90 days by default) and the API can fail.
      # Without this the monitor would just die quietly.
      - name: Tell Telegram the poll failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>Tailscale monitor stopped</b>
          Polling failed repeatedly (expired API token, API outage or a bad state push).
          The watchdog will try again within ~10 minutes.
          <a href=\"${RUN_URL}\">Open the workflow run</a>" > /dev/null
